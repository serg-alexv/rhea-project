name: RheaApp
options:
  bundleIdPrefix: com.rhea
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"

packages:
  RheaKit:
    path: ../../packages/RheaKit
  AnimatedTabBar:
    url: https://github.com/serg-alexv/AnimatedTabBar
    from: "0.0.1"

targets:
  RheaApp:
    type: application
    platform: iOS
    sources:
      - path: ../RheaPreview.swiftpm/Sources
        includes:
          - RheaPreviewApp.swift
          - ScreenPilotView.swift
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhea.preview
        DEVELOPMENT_TEAM: "398XACWZ7G"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        debug: {}
        release: {}
    dependencies:
      - package: RheaKit
      - package: AnimatedTabBar
    info:
      path: Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Rhea
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
