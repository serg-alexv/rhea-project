<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhea Scientific Gem</title>
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --surface2: #1f2937;
    --border: #374151; --text: #e5e7eb; --dim: #9ca3af;
    --accent: #60a5fa; --green: #34d399; --red: #f87171;
    --amber: #fbbf24; --purple: #a78bfa;
    --font: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }

  .grid { display: grid; grid-template-columns: 280px 1fr 320px; grid-template-rows: 48px 1fr 200px; height: 100vh; gap: 1px; background: var(--border); }
  .panel { background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
  .panel-header { padding: 8px 12px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px; }

  /* Top bar */
  .topbar { grid-column: 1 / -1; background: var(--surface2); display: flex; align-items: center; padding: 0 16px; gap: 16px; }
  .topbar h1 { font-size: 14px; color: var(--accent); font-weight: 600; }
  .topbar .status { font-size: 11px; color: var(--dim); }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.dead { background: var(--red); }

  /* Left panel: agents */
  .agent-card { padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
  .agent-card .name { font-weight: 600; color: var(--accent); font-size: 12px; }
  .agent-card .meta { font-size: 10px; color: var(--dim); margin-top: 4px; }

  /* Center panel: tribunal */
  .tribunal-input { display: flex; gap: 8px; padding: 12px; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .tribunal-input input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 4px; font-family: var(--font); font-size: 13px; }
  .tribunal-input input:focus { outline: none; border-color: var(--accent); }
  .tribunal-input button { background: var(--accent); color: var(--bg); border: none; padding: 8px 16px; border-radius: 4px; font-family: var(--font); font-weight: 600; cursor: pointer; }
  .tribunal-input button:hover { opacity: 0.9; }
  .tribunal-input button:disabled { opacity: 0.4; cursor: not-allowed; }

  .result-card { padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; }
  .result-card .header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .result-card .model { color: var(--purple); font-size: 11px; }
  .result-card .score { font-weight: 600; }
  .result-card .text { color: var(--dim); font-size: 12px; line-height: 1.5; }

  .consensus-box { background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .consensus-box .label { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .consensus-box .scores { display: flex; gap: 16px; margin-top: 8px; }
  .consensus-box .score-item { text-align: center; }
  .consensus-box .score-val { font-size: 20px; font-weight: 700; }
  .consensus-box .score-label { font-size: 9px; color: var(--dim); text-transform: uppercase; }
  .math-tag { display: inline-block; background: var(--purple); color: var(--bg); font-size: 9px; padding: 2px 6px; border-radius: 3px; margin: 2px; }

  /* Right panel: events */
  .event-item { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
  .event-item .time { color: var(--dim); font-size: 10px; }
  .event-item .type { color: var(--amber); }

  /* Bottom panel: event log */
  .bottom { grid-column: 1 / -1; }
  .log-line { font-size: 11px; padding: 2px 0; color: var(--dim); }
  .log-line .ts { color: var(--border); }
  .log-line.error { color: var(--red); }
  .log-line.event { color: var(--green); }

  .bar { height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .bar-fill.green { background: var(--green); }
  .bar-fill.amber { background: var(--amber); }
  .bar-fill.red { background: var(--red); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="grid">
  <!-- Top bar -->
  <div class="topbar">
    <h1>RHEA</h1>
    <span class="status"><span class="dot" id="statusDot"></span> <span id="statusText">connecting...</span></span>
    <span class="status" id="redisStatus"></span>
    <span class="status" id="providerCount"></span>
    <span style="flex:1"></span>
    <span class="status" id="clock"></span>
  </div>

  <!-- Left: Agents -->
  <div class="panel">
    <div class="panel-header">Agents</div>
    <div class="panel-body" id="agentsPanel">
      <div style="color:var(--dim)">Loading...</div>
    </div>
  </div>

  <!-- Center: Tribunal -->
  <div class="panel" style="display:flex;flex-direction:column">
    <div class="panel-header">
      <span>Tribunal Console</span>
      <span id="tribunalStatus"></span>
    </div>
    <div class="tribunal-input">
      <input id="promptInput" placeholder="Ask the tribunal..." autofocus>
      <button id="askBtn" onclick="askTribunal()">ASK</button>
    </div>
    <div class="panel-body" id="tribunalResults">
      <div style="color:var(--dim);text-align:center;margin-top:40px">
        Enter a question to query the multi-model tribunal.<br>
        Models deliberate independently, then consensus is analyzed.
      </div>
    </div>
  </div>

  <!-- Right: Events -->
  <div class="panel">
    <div class="panel-header">
      <span>Live Events</span>
      <span id="eventCount" style="color:var(--accent)">0</span>
    </div>
    <div class="panel-body" id="eventsPanel"></div>
  </div>

  <!-- Bottom: Log -->
  <div class="panel bottom">
    <div class="panel-header">System Log</div>
    <div class="panel-body" id="logPanel" style="font-size:11px"></div>
  </div>
</div>

<script>
const API = location.origin;
let eventCount = 0;

function log(msg, cls = '') {
  const el = document.getElementById('logPanel');
  const ts = new Date().toLocaleTimeString();
  el.innerHTML = `<div class="log-line ${cls}"><span class="ts">${ts}</span> ${msg}</div>` + el.innerHTML;
  if (el.children.length > 200) el.lastChild.remove();
}

function barColor(val) { return val >= 0.7 ? 'green' : val >= 0.4 ? 'amber' : 'red'; }

// Health check
async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    document.getElementById('statusDot').className = 'dot live';
    document.getElementById('statusText').textContent = 'online';
    document.getElementById('redisStatus').textContent = `Redis: ${d.redis || '?'}`;
    if (d.live_agents && d.live_agents.length) {
      log(`Agents online: ${d.live_agents.join(', ')}`, 'event');
    }

    const r2 = await fetch(`${API}/api/health`);
    const d2 = await r2.json();
    document.getElementById('providerCount').textContent = `Providers: ${d2.providers_available}/${d2.providers_total} | Models: ${d2.total_models}`;
  } catch(e) {
    document.getElementById('statusDot').className = 'dot dead';
    document.getElementById('statusText').textContent = 'offline';
    log(`Health check failed: ${e.message}`, 'error');
  }
}

// Agents panel
async function loadAgents() {
  try {
    const r = await fetch(`${API}/agents`);
    const d = await r.json();
    const el = document.getElementById('agentsPanel');
    const agents = d.agents || {};
    const names = Object.keys(agents);
    if (!names.length) {
      el.innerHTML = '<div style="color:var(--dim)">No live agents. Send a heartbeat to register.</div>';
      return;
    }
    el.innerHTML = names.map(name => {
      const a = agents[name];
      const age = Math.round(Date.now()/1000 - a.ts);
      return `<div class="agent-card">
        <div class="name">${a.agent}</div>
        <div class="meta">Status: ${a.status} | ${age}s ago</div>
      </div>`;
    }).join('');
  } catch(e) {}
}

// SSE Events
function connectSSE() {
  log('Connecting to SSE stream...');
  const es = new EventSource(`${API}/events`);
  es.onmessage = (e) => {
    try {
      const evt = JSON.parse(e.data);
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount;
      const panel = document.getElementById('eventsPanel');
      const ts = new Date(evt.ts * 1000).toLocaleTimeString();
      panel.innerHTML = `<div class="event-item"><span class="time">${ts}</span> <span class="type">${evt.type}</span> ${evt.agent || ''} ${JSON.stringify(evt.data || {}).slice(0, 80)}</div>` + panel.innerHTML;
      if (panel.children.length > 100) panel.lastChild.remove();
      log(`Event: ${evt.type} from ${evt.agent}`, 'event');
    } catch(e2) {}
  };
  es.onerror = () => { log('SSE disconnected, retrying...', 'error'); };
}

// Tribunal
async function askTribunal() {
  const input = document.getElementById('promptInput');
  const btn = document.getElementById('askBtn');
  const prompt = input.value.trim();
  if (!prompt) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  document.getElementById('tribunalStatus').textContent = 'querying...';
  log(`Tribunal query: "${prompt.slice(0, 60)}..."`);

  try {
    // Get dev API key from health endpoint (hacky but works for dev)
    const r = await fetch(`${API}/api/tribunal`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-API-Key': 'dev-bypass'},
      body: JSON.stringify({prompt, k: 5, tier: 'cheap', mode: 'local'}),
    });

    if (r.status === 401) {
      // Try without key
      const r2 = await fetch(`${API}/api/tribunal`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt, k: 3, tier: 'cheap', mode: 'local'}),
      });
      if (!r2.ok) throw new Error(`HTTP ${r2.status}`);
      renderResult(await r2.json());
    } else if (!r.ok) {
      throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    } else {
      renderResult(await r.json());
    }
  } catch(e) {
    log(`Tribunal error: ${e.message}`, 'error');
    document.getElementById('tribunalResults').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'ASK';
    document.getElementById('tribunalStatus').textContent = '';
  }
}

function renderResult(d) {
  const mathDomains = Object.keys(d.math_verification || {});
  const mathHtml = mathDomains.length ?
    `<div style="margin-top:8px">${mathDomains.map(dom => {
      const v = d.math_verification[dom];
      return `<span class="math-tag">${dom}: ${v.overall || '?'}</span>`;
    }).join('')}</div>` : '';

  const responsesHtml = (d.responses || []).map(r => `
    <div class="result-card">
      <div class="header">
        <span class="model">${r.provider}/${r.model}</span>
        <span style="font-size:10px;color:var(--dim)">${r.latency_s.toFixed(1)}s</span>
      </div>
      <div class="text">${r.error ? `<span style="color:var(--red)">Error: ${r.error}</span>` : r.text.slice(0, 300)}${r.text.length > 300 ? '...' : ''}</div>
    </div>
  `).join('');

  document.getElementById('tribunalResults').innerHTML = `
    <div class="consensus-box">
      <div class="label">Consensus (${d.mode} | ${d.analysis_method})</div>
      <div style="font-size:12px;line-height:1.5">${d.consensus.slice(0, 500)}</div>
      <div class="scores">
        <div class="score-item">
          <div class="score-val" style="color:var(--${barColor(d.confidence)})">${(d.confidence * 100).toFixed(0)}%</div>
          <div class="score-label">Confidence</div>
        </div>
        <div class="score-item">
          <div class="score-val" style="color:var(--${barColor(d.agreement_score)})">${(d.agreement_score * 100).toFixed(0)}%</div>
          <div class="score-label">Agreement</div>
        </div>
        <div class="score-item">
          <div class="score-val">${d.models_responded}/${d.models_queried}</div>
          <div class="score-label">Models</div>
        </div>
        <div class="score-item">
          <div class="score-val">${d.elapsed_s}s</div>
          <div class="score-label">Elapsed</div>
        </div>
      </div>
      ${mathHtml}
    </div>
    ${responsesHtml}
  `;
  log(`Tribunal result: ${d.models_responded} models, confidence ${(d.confidence*100).toFixed(0)}%, ${d.elapsed_s}s`, 'event');
}

// Enter key
document.getElementById('promptInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') askTribunal();
});

// Clock
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}, 1000);

// Init
checkHealth();
loadAgents();
connectSSE();
setInterval(checkHealth, 15000);
setInterval(loadAgents, 10000);
</script>
</body>
</html>
