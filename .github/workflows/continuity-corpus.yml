name: continuity-corpus

on:
  push:
    paths:
      - 'eval/continuity_v1/**'
      - 'scripts/validate_continuity_corpus.py'
      - 'tests/test_continuity_corpus.py'
      - '.github/workflows/continuity-corpus.yml'
  pull_request:
    paths:
      - 'eval/continuity_v1/**'
      - 'scripts/validate_continuity_corpus.py'
      - 'tests/test_continuity_corpus.py'
      - '.github/workflows/continuity-corpus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test deterministic oracle and failure reporting
        run: python3 -m unittest tests/test_continuity_corpus.py -v
      - name: Validate corpus structure, ontology packs, and dimension coverage
        run: >-
          python3 scripts/validate_continuity_corpus.py
          --corpus eval/continuity_v1/cases.jsonl
          --ontologies eval/continuity_v1/ontology_packs.json
      - name: Score canonical candidate by dimension
        run: >-
          python3 scripts/validate_continuity_corpus.py
          --corpus eval/continuity_v1/cases.jsonl
          --ontologies eval/continuity_v1/ontology_packs.json
          --candidate eval/continuity_v1/golden.jsonl
          --report continuity-score.json
      - name: Upload deterministic score report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-score
          path: continuity-score.json
          if-no-files-found: error
