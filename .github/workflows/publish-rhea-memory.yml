name: Publish rhea-memory to PyPI

on:
  push:
    tags:
      - 'rhea-memory-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        working-directory: packages/rhea-memory
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: rhea-memory-dist
          path: packages/rhea-memory/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rhea-memory-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
