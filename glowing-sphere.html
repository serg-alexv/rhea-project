<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing 3D Sphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            display: block;
        }
        
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            animation: fadeIn 2s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="hint">Move mouse to interact</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x000000, 1);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Create main sphere with glowing material
        const sphereGeometry = new THREE.SphereGeometry(1.5, 64, 64);
        const sphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x00ffff,
            emissive: 0x00ffff,
            emissiveIntensity: 0.4,
            shininess: 100,
            specular: 0xffffff,
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);
        
        // Create outer glow sphere (slightly larger, transparent)
        const glowGeometry = new THREE.SphereGeometry(1.7, 64, 64);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide,
        });
        const glowSphere = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(glowSphere);
        
        // Create outer glow layer 2
        const glowGeometry2 = new THREE.SphereGeometry(2.0, 64, 64);
        const glowMaterial2 = new THREE.MeshBasicMaterial({
            color: 0x0088ff,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide,
        });
        const glowSphere2 = new THREE.Mesh(glowGeometry2, glowMaterial2);
        scene.add(glowSphere2);
        
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        
        // Point lights for dramatic effect
        const pointLight1 = new THREE.PointLight(0x00ffff, 1, 100);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0xff00ff, 0.8, 100);
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);
        
        const pointLight3 = new THREE.PointLight(0x00ff00, 0.5, 100);
        pointLight3.position.set(0, 5, -5);
        scene.add(pointLight3);
        
        // Mouse position tracking
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;
        
        document.addEventListener('mousemove', (event) => {
            // Normalize mouse position to -1 to 1
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = (event.clientY / window.innerHeight) * 2 - 1;
            
            // Set target rotation based on mouse position
            targetRotationY = mouseX * Math.PI * 0.5;
            targetRotationX = mouseY * Math.PI * 0.5;
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation variables
        let time = 0;
        const baseRotationSpeed = 0.005;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            
            // Base rotation (continuous spin)
            sphere.rotation.y += baseRotationSpeed;
            sphere.rotation.x += baseRotationSpeed * 0.5;
            
            glowSphere.rotation.y += baseRotationSpeed * 0.9;
            glowSphere.rotation.x += baseRotationSpeed * 0.4;
            
            glowSphere2.rotation.y += baseRotationSpeed * 0.8;
            glowSphere2.rotation.x += baseRotationSpeed * 0.3;
            
            // Smooth mouse influence (lerp towards target)
            sphere.rotation.y += (targetRotationY - sphere.rotation.y) * 0.05;
            sphere.rotation.x += (targetRotationX - sphere.rotation.x) * 0.05;
            
            glowSphere.rotation.y += (targetRotationY - glowSphere.rotation.y) * 0.04;
            glowSphere.rotation.x += (targetRotationX - glowSphere.rotation.x) * 0.04;
            
            glowSphere2.rotation.y += (targetRotationY - glowSphere2.rotation.y) * 0.03;
            glowSphere2.rotation.x += (targetRotationX - glowSphere2.rotation.x) * 0.03;
            
            // Pulsing glow effect
            const pulse = Math.sin(time * 2) * 0.1 + 0.4;
            sphereMaterial.emissiveIntensity = pulse;
            
            const glowPulse = Math.sin(time * 2) * 0.05 + 0.15;
            glowMaterial.opacity = glowPulse;
            
            const glow2Pulse = Math.sin(time * 2 + 1) * 0.03 + 0.08;
            glowMaterial2.opacity = glow2Pulse;
            
            // Move lights based on mouse for dynamic lighting
            pointLight1.position.x = 5 + mouseX * 2;
            pointLight1.position.y = 5 + mouseY * 2;
            
            pointLight2.position.x = -5 - mouseX * 2;
            pointLight2.position.y = -5 - mouseY * 2;
            
            renderer.render(scene, camera);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
