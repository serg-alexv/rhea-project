# 8) Execution recipes (console-first, no agents)
# -----------------------------
[recipes.console.play_selector_mapping]
step_0 = 'file /Applications/Play.app/Contents/MacOS/Play'
step_1 = 'otool -arch arm64 -vV -s __TEXT __objc_methname /Applications/Play.app/Contents/MacOS/Play | grep -n "evaluateScript:" | head -n 20'
step_2 = 'otool -arch arm64 -vV -s __DATA __objc_selrefs /Applications/Play.app/Contents/MacOS/Play | head -n 400 > /tmp/selrefs_head.txt'
step_3 = 'otool -arch arm64 -vV -s __DATA __objc_classrefs /Applications/Play.app/Contents/MacOS/Play | head -n 200 > /tmp/classrefs_head.txt'
step_4 = '## in BN GUI: search for methname addr (0x102ed2b4b), then find xrefs; identify selref addresses and callsites'
success = "3–10 callsite functions + slice; plus counts of xrefs"

[recipes.console.play_strings_typeharvest]
cmd_1 = 'strings /Applications/Play.app/Contents/MacOS/Play | grep -E "PlayNodes|NodeViewModel|NodeData|ComponentEvent" | head -n 200'
cmd_2 = 'strings /Applications/Play.app/Contents/MacOS/Play | grep -E "JSCoreScripts/app\.js|JSContext|JSValue|evaluateScript:" | head -n 200'
success = "top namespaces + evidence of Node/Component graph terms"

[recipes.console.extraction_schema]
cmd_1 = 'find ios/play-extraction -name "*.json" -print0 | xargs -0 -n 1 -I{} sh -lc 'jq -c "paths | map(tostring) | join(\".\")" "{}" 2>/dev/null | head -n 200''
cmd_2 = 'python3 scripts/schema_scan.py ios/play-extraction > /tmp/playui_schema.tsv  # (if exists; otherwise use your current scanner)'
success = "key frequency table + where full project graph actually resides (if at all)"

