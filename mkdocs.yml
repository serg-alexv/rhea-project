site_name: Rhea Project Documentation
site_description: Multi-platform AI integration system documentation
site_author: timelabs npo
site_url: https://timelabs.github.io/rhea-project

# Repository
repo_name: timelabs/rhea-project
repo_url: https://github.com/timelabs/rhea-project
edit_uri: ""

# Theme
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

# Navigation
nav:
  - Home: README.md
  - What Exists: WHAT_EXISTS.md
  - What Works: WHAT_WORKS.md
  - What Next: WHAT_NEXT.md
  - Architecture Map: ARCHITECTURE_MAP.md

# Plugins
plugins:
  - search:
      lang: en

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: timelabs
      repo: rhea-project
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
exclude_docs: |
  includes/
  node_modules/
  **/node_modules/
  system-docs/
  rhea-atlas-out/
  build/
  .next/
  target/
  dist/

# Copyright
copyright: |
  &copy; 2026 timelabs npo - 
  <a href="#__consent">Change cookie settings</a>
