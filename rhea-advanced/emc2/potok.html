<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ПОТОК</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e8e0d4;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  #ui-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
  }

  #title-bar {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 20;
  }

  #title-bar h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(232, 224, 212, 0.4);
  }

  #level-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 300;
    color: rgba(232, 224, 212, 0.25);
    margin-top: 4px;
    letter-spacing: 2px;
  }

  #toolbar {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    pointer-events: all;
    z-index: 20;
  }

  .tool-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1.5px solid rgba(232, 224, 212, 0.15);
    background: rgba(10, 10, 15, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: rgba(232, 224, 212, 0.5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .tool-btn:hover {
    border-color: rgba(232, 224, 212, 0.4);
    color: rgba(232, 224, 212, 0.9);
    transform: scale(1.08);
  }

  .tool-btn.active {
    border-color: rgba(232, 224, 212, 0.6);
    color: #e8e0d4;
    box-shadow: 0 0 20px rgba(232, 224, 212, 0.1);
  }

  .tool-btn.source.active {
    border-color: rgba(100, 210, 255, 0.6);
    color: rgba(100, 210, 255, 0.9);
    box-shadow: 0 0 20px rgba(100, 210, 255, 0.15);
  }

  .tool-btn.sink.active {
    border-color: rgba(255, 100, 160, 0.6);
    color: rgba(255, 100, 160, 0.9);
    box-shadow: 0 0 20px rgba(255, 100, 160, 0.15);
  }

  .tool-btn.erase.active {
    border-color: rgba(255, 200, 100, 0.6);
    color: rgba(255, 200, 100, 0.9);
  }

  .tool-count {
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    background: rgba(10, 10, 15, 0.9);
    border-radius: 10px;
    padding: 1px 5px;
    color: rgba(232, 224, 212, 0.5);
    border: 1px solid rgba(232, 224, 212, 0.15);
  }

  .divider {
    width: 1px;
    height: 30px;
    background: rgba(232, 224, 212, 0.1);
  }

  #hint-text {
    position: fixed;
    bottom: 95px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 300;
    color: rgba(232, 224, 212, 0.3);
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.5s;
    font-style: italic;
  }

  #completion-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }

  #completion-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  #completion-overlay h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 28px;
    letter-spacing: 6px;
    color: rgba(232, 224, 212, 0.8);
    margin-bottom: 8px;
  }

  #completion-overlay .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(232, 224, 212, 0.3);
    letter-spacing: 2px;
    margin-bottom: 30px;
  }

  #next-btn {
    padding: 12px 40px;
    border: 1px solid rgba(232, 224, 212, 0.25);
    background: transparent;
    color: rgba(232, 224, 212, 0.7);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
  }

  #next-btn:hover {
    border-color: rgba(232, 224, 212, 0.5);
    color: #e8e0d4;
  }

  #intro-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.95);
    z-index: 200;
    transition: opacity 1s ease;
  }

  #intro-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #intro-overlay h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 48px;
    letter-spacing: 16px;
    color: rgba(232, 224, 212, 0.7);
    margin-bottom: 12px;
  }

  #intro-overlay .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 16px;
    color: rgba(232, 224, 212, 0.25);
    letter-spacing: 3px;
    margin-bottom: 50px;
    font-style: italic;
  }

  #start-btn {
    padding: 14px 50px;
    border: 1px solid rgba(232, 224, 212, 0.2);
    background: transparent;
    color: rgba(232, 224, 212, 0.5);
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 6px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s;
  }

  #start-btn:hover {
    border-color: rgba(232, 224, 212, 0.5);
    color: rgba(232, 224, 212, 0.9);
    box-shadow: 0 0 40px rgba(232, 224, 212, 0.05);
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.45; }
  }

  #intro-overlay .tagline { animation: breathe 4s ease-in-out infinite; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="title-bar">
  <h1>ПОТОК</h1>
  <div id="level-info"></div>
</div>

<div id="hint-text"></div>

<div id="toolbar">
  <button class="tool-btn source active" id="btn-source" title="Источник">
    ◉
    <span class="tool-count" id="count-source"></span>
  </button>
  <button class="tool-btn sink" id="btn-sink" title="Сток">
    ◎
    <span class="tool-count" id="count-sink"></span>
  </button>
  <div class="divider"></div>
  <button class="tool-btn erase" id="btn-erase" title="Убрать">✕</button>
  <div class="divider"></div>
  <button class="tool-btn" id="btn-reset" title="Сброс">↺</button>
</div>

<div id="completion-overlay">
  <h2>РУСЛО НАЙДЕНО</h2>
  <div class="sub" id="completion-sub"></div>
  <button id="next-btn">ДАЛЕЕ</button>
</div>

<div id="intro-overlay">
  <h1>ПОТОК</h1>
  <div class="tagline">не точки опоры — а острова стабильности</div>
  <button id="start-btn">Войти</button>
</div>

<script>
// ══════════════════════════════════════════════
// ПОТОК — Flow Engineering Game
// Math: 2D potential flow, superposition principle
// ══════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ── State ──
let currentTool = 'source'; // source, sink, erase
let placedElements = []; // {x, y, type: 'source'|'sink', strength}
let particles = [];
let gameStarted = false;
let currentLevel = 0;
let levelComplete = false;
let gateFlowAccum = [];
let completionShown = false;

const MAX_PARTICLES = 600;
const PARTICLE_SPEED = 1.8;
const TRAIL_LENGTH = 12;

// ── Levels ──
const levels = [
  {
    name: 'Исток',
    hint: 'Поставь источник — и наблюдай, как рождается поток',
    sources: 1, sinks: 0,
    gates: [
      { x: 0.75, y: 0.5, radius: 40, angle: 0 }
    ],
    walls: []
  },
  {
    name: 'Притяжение',
    hint: 'Сток притягивает. Направь поток сквозь врата',
    sources: 1, sinks: 1,
    gates: [
      { x: 0.5, y: 0.3, radius: 35, angle: 0 }
    ],
    walls: []
  },
  {
    name: 'Развилка',
    hint: 'Два русла. Один исток. Как?',
    sources: 1, sinks: 2,
    gates: [
      { x: 0.3, y: 0.25, radius: 35, angle: 0 },
      { x: 0.7, y: 0.75, radius: 35, angle: 0 }
    ],
    walls: []
  },
  {
    name: 'Обход',
    hint: 'Стена не пропускает поток. Обойди.',
    sources: 2, sinks: 1,
    gates: [
      { x: 0.75, y: 0.5, radius: 35, angle: 0 }
    ],
    walls: [
      { x1: 0.5, y1: 0.2, x2: 0.5, y2: 0.65 }
    ]
  },
  {
    name: 'Противоток',
    hint: 'Два потока. Встречных. Оба должны пройти.',
    sources: 2, sinks: 2,
    gates: [
      { x: 0.3, y: 0.35, radius: 32, angle: 0 },
      { x: 0.7, y: 0.65, radius: 32, angle: 0 },
      { x: 0.5, y: 0.5, radius: 32, angle: 0 }
    ],
    walls: []
  },
  {
    name: 'Каскад',
    hint: 'Градиент не знает прямых линий',
    sources: 3, sinks: 2,
    gates: [
      { x: 0.25, y: 0.3, radius: 30, angle: 0 },
      { x: 0.5, y: 0.5, radius: 30, angle: 0 },
      { x: 0.75, y: 0.7, radius: 30, angle: 0 },
      { x: 0.5, y: 0.2, radius: 30, angle: 0 }
    ],
    walls: [
      { x1: 0.35, y1: 0.4, x2: 0.35, y2: 0.75 }
    ]
  },
  {
    name: 'Остров стабильности',
    hint: 'Построй такой поток, чтобы все врата питались одновременно',
    sources: 3, sinks: 3,
    gates: [
      { x: 0.2, y: 0.3, radius: 28, angle: 0 },
      { x: 0.5, y: 0.15, radius: 28, angle: 0 },
      { x: 0.8, y: 0.3, radius: 28, angle: 0 },
      { x: 0.35, y: 0.7, radius: 28, angle: 0 },
      { x: 0.65, y: 0.7, radius: 28, angle: 0 }
    ],
    walls: [
      { x1: 0.5, y1: 0.35, x2: 0.5, y2: 0.55 }
    ]
  }
];

// ── Level Management ──
function getLevel() { return levels[currentLevel]; }

function getGatesAbsolute() {
  return getLevel().gates.map((g, i) => ({
    x: g.x * W,
    y: g.y * H,
    radius: g.radius * (Math.min(W, H) / 700),
    satisfied: false,
    flow: 0,
    idx: i
  }));
}

function getWallsAbsolute() {
  return getLevel().walls.map(w => ({
    x1: w.x1 * W, y1: w.y1 * H,
    x2: w.x2 * W, y2: w.y2 * H
  }));
}

let gates = [];
let walls = [];

function loadLevel() {
  const lvl = getLevel();
  placedElements = [];
  particles = [];
  gates = getGatesAbsolute();
  walls = getWallsAbsolute();
  gateFlowAccum = gates.map(() => 0);
  levelComplete = false;
  completionShown = false;

  document.getElementById('level-info').textContent =
    `${String(currentLevel + 1).padStart(2, '0')} — ${lvl.name}`;
  document.getElementById('hint-text').textContent = lvl.hint;
  document.getElementById('hint-text').style.opacity = '1';
  updateCounts();

  document.getElementById('completion-overlay').classList.remove('visible');

  setTimeout(() => {
    document.getElementById('hint-text').style.opacity = '0';
  }, 4000);
}

function updateCounts() {
  const lvl = getLevel();
  const placedSources = placedElements.filter(e => e.type === 'source').length;
  const placedSinks = placedElements.filter(e => e.type === 'sink').length;
  document.getElementById('count-source').textContent = `${lvl.sources - placedSources}`;
  document.getElementById('count-sink').textContent = `${lvl.sinks - placedSinks}`;
}

function getRemainingCount(type) {
  const lvl = getLevel();
  const placed = placedElements.filter(e => e.type === type).length;
  const max = type === 'source' ? lvl.sources : lvl.sinks;
  return max - placed;
}

// ── Physics ──
function computeVelocity(x, y) {
  let vx = 0, vy = 0;

  for (const el of placedElements) {
    const dx = x - el.x;
    const dy = y - el.y;
    const dist2 = dx * dx + dy * dy;
    const minDist2 = 400;
    const d2 = Math.max(dist2, minDist2);
    const strength = el.type === 'source' ? el.strength : -el.strength;

    vx += strength * dx / d2;
    vy += strength * dy / d2;
  }

  // Wall repulsion
  for (const wall of walls) {
    const wx = wall.x2 - wall.x1;
    const wy = wall.y2 - wall.y1;
    const wLen2 = wx * wx + wy * wy;
    if (wLen2 === 0) continue;

    const t = Math.max(0, Math.min(1,
      ((x - wall.x1) * wx + (y - wall.y1) * wy) / wLen2));

    const closestX = wall.x1 + t * wx;
    const closestY = wall.y1 + t * wy;

    const dx = x - closestX;
    const dy = y - closestY;
    const dist2 = dx * dx + dy * dy;
    const repulseRadius = 1800;

    if (dist2 < repulseRadius && dist2 > 1) {
      const force = 80 / dist2;
      const dist = Math.sqrt(dist2);
      vx += force * dx / dist;
      vy += force * dy / dist;
    }
  }

  return { vx, vy };
}

// ── Particles ──
function spawnParticles() {
  const sourcesPlaced = placedElements.filter(e => e.type === 'source');
  if (sourcesPlaced.length === 0) return;

  const particlesPerSource = Math.floor(MAX_PARTICLES / Math.max(sourcesPlaced.length, 1));

  for (const src of sourcesPlaced) {
    const existing = particles.filter(p => p.sourceId === src.id).length;
    const toSpawn = Math.min(3, particlesPerSource - existing);

    for (let i = 0; i < toSpawn; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = 15 + Math.random() * 10;
      particles.push({
        x: src.x + Math.cos(angle) * r,
        y: src.y + Math.sin(angle) * r,
        trail: [],
        life: 0,
        maxLife: 200 + Math.random() * 300,
        sourceId: src.id,
        alpha: 0
      });
    }
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const { vx, vy } = computeVelocity(p.x, p.y);
    const speed = Math.sqrt(vx * vx + vy * vy);
    const maxSpeed = PARTICLE_SPEED * 3;

    let nvx, nvy;
    if (speed > 0.01) {
      const clampedSpeed = Math.min(speed, maxSpeed);
      const scale = PARTICLE_SPEED * (clampedSpeed / speed);
      nvx = vx * scale / speed * PARTICLE_SPEED;
      nvy = vy * scale / speed * PARTICLE_SPEED;
    } else {
      nvx = (Math.random() - 0.5) * 0.3;
      nvy = (Math.random() - 0.5) * 0.3;
    }

    p.x += nvx;
    p.y += nvy;
    p.life++;
    p.alpha = Math.min(1, p.life / 20) * Math.max(0, 1 - p.life / p.maxLife);

    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > TRAIL_LENGTH) p.trail.shift();

    // Check gate passage
    for (let gi = 0; gi < gates.length; gi++) {
      const g = gates[gi];
      const dx = p.x - g.x;
      const dy = p.y - g.y;
      if (dx * dx + dy * dy < g.radius * g.radius) {
        gateFlowAccum[gi] += 0.15;
      }
    }

    // Remove dead or offscreen
    const margin = 50;
    if (p.life > p.maxLife ||
        p.x < -margin || p.x > W + margin ||
        p.y < -margin || p.y > H + margin) {
      particles.splice(i, 1);
      continue;
    }

    // Sink absorption
    for (const el of placedElements) {
      if (el.type !== 'sink') continue;
      const dx = p.x - el.x;
      const dy = p.y - el.y;
      if (dx * dx + dy * dy < 200) {
        particles.splice(i, 1);
        break;
      }
    }
  }
}

function checkCompletion() {
  if (levelComplete) return;

  const threshold = 30;
  const allSatisfied = gateFlowAccum.every(f => f >= threshold);

  gates.forEach((g, i) => {
    g.flow = Math.min(1, gateFlowAccum[i] / threshold);
    g.satisfied = gateFlowAccum[i] >= threshold;
  });

  if (allSatisfied && placedElements.length > 0) {
    levelComplete = true;
    setTimeout(showCompletion, 600);
  }
}

function showCompletion() {
  if (completionShown) return;
  completionShown = true;

  const overlay = document.getElementById('completion-overlay');
  const sub = document.getElementById('completion-sub');

  const phrases = [
    'поток нашёл форму',
    'градиент не ошибается',
    'русло — не путь, а следствие',
    'стабильность — не покой, а баланс',
    'нет точек — есть бассейны',
    'форма задаёт русло',
    'перепад делает работу'
  ];
  sub.textContent = phrases[currentLevel % phrases.length];
  overlay.classList.add('visible');
}

// ── Rendering ──
function drawBackground() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(232, 224, 212, 0.02)';
  ctx.lineWidth = 0.5;
  const gridSize = 60;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawVectorField() {
  if (placedElements.length === 0) return;

  const step = 35;
  const arrowLen = 12;

  for (let x = step; x < W; x += step) {
    for (let y = step; y < H; y += step) {
      const { vx, vy } = computeVelocity(x, y);
      const speed = Math.sqrt(vx * vx + vy * vy);
      if (speed < 0.001) continue;

      const nx = vx / speed;
      const ny = vy / speed;
      const displayLen = Math.min(arrowLen, speed * 8);
      const alpha = Math.min(0.12, speed * 0.4);

      ctx.strokeStyle = `rgba(232, 224, 212, ${alpha})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + nx * displayLen, y + ny * displayLen);
      ctx.stroke();
    }
  }
}

function drawWalls() {
  for (const wall of walls) {
    const grad = ctx.createLinearGradient(wall.x1, wall.y1, wall.x2, wall.y2);
    grad.addColorStop(0, 'rgba(255, 200, 100, 0)');
    grad.addColorStop(0.2, 'rgba(255, 200, 100, 0.3)');
    grad.addColorStop(0.8, 'rgba(255, 200, 100, 0.3)');
    grad.addColorStop(1, 'rgba(255, 200, 100, 0)');

    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(wall.x1, wall.y1);
    ctx.lineTo(wall.x2, wall.y2);
    ctx.stroke();

    // Glow
    ctx.strokeStyle = 'rgba(255, 200, 100, 0.05)';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(wall.x1, wall.y1);
    ctx.lineTo(wall.x2, wall.y2);
    ctx.stroke();
  }
}

function drawGates(time) {
  for (const g of gates) {
    const pulse = 0.7 + 0.3 * Math.sin(time * 0.003 + g.idx * 1.5);
    const flowAlpha = g.flow;

    // Unsatisfied: dim green ring. Satisfied: bright.
    const r = g.satisfied ? 100 : 80;
    const green = g.satisfied ? 255 : 200;
    const b = g.satisfied ? 130 : 100;
    const alpha = g.satisfied ? 0.6 : (0.15 + flowAlpha * 0.3);

    // Outer glow
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius + 8, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${r}, ${green}, ${b}, ${alpha * 0.3 * pulse})`;
    ctx.lineWidth = 6;
    ctx.stroke();

    // Ring
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${r}, ${green}, ${b}, ${alpha * pulse})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Fill arc showing progress
    if (!g.satisfied && flowAlpha > 0) {
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * flowAlpha);
      ctx.strokeStyle = `rgba(${r}, ${green}, ${b}, ${0.5})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Satisfied check
    if (g.satisfied) {
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.radius * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100, 255, 130, ${0.3 * pulse})`;
      ctx.fill();
    }
  }
}

function drawPlacedElements(time) {
  for (const el of placedElements) {
    const pulse = 0.8 + 0.2 * Math.sin(time * 0.004 + el.id);

    if (el.type === 'source') {
      // Cyan glow
      ctx.beginPath();
      ctx.arc(el.x, el.y, 18, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100, 210, 255, ${0.08 * pulse})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(el.x, el.y, 10, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100, 210, 255, ${0.25 * pulse})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(el.x, el.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180, 230, 255, ${0.7})`;
      ctx.fill();
    } else {
      // Magenta glow
      ctx.beginPath();
      ctx.arc(el.x, el.y, 18, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 100, 160, ${0.08 * pulse})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(el.x, el.y, 10, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 100, 160, ${0.35 * pulse})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(el.x, el.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 150, 190, 0.6)`;
      ctx.fill();
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    if (p.trail.length < 2) continue;

    const baseAlpha = p.alpha * 0.7;

    for (let t = 1; t < p.trail.length; t++) {
      const prev = p.trail[t - 1];
      const curr = p.trail[t];
      const trailAlpha = baseAlpha * (t / p.trail.length);

      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(curr.x, curr.y);
      ctx.strokeStyle = `rgba(255, 210, 140, ${trailAlpha})`;
      ctx.lineWidth = 1.2 * (t / p.trail.length);
      ctx.stroke();
    }

    // Head
    const headAlpha = p.alpha * 0.9;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 230, 180, ${headAlpha})`;
    ctx.fill();
  }
}

// ── Interaction ──
let nextId = 0;

canvas.addEventListener('pointerdown', (e) => {
  if (!gameStarted || levelComplete) return;

  const x = e.clientX;
  const y = e.clientY;

  // Check if clicking near toolbar area
  if (y > H - 100) return;

  if (currentTool === 'erase') {
    // Find nearest element
    let nearest = -1;
    let nearestDist = 40;
    for (let i = 0; i < placedElements.length; i++) {
      const el = placedElements[i];
      const dx = el.x - x;
      const dy = el.y - y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = i;
      }
    }
    if (nearest >= 0) {
      placedElements.splice(nearest, 1);
      // Reset gate accumulation
      gateFlowAccum = gates.map(() => 0);
      gates.forEach(g => { g.flow = 0; g.satisfied = false; });
      updateCounts();
    }
    return;
  }

  // Check if too close to wall
  for (const wall of walls) {
    const wx = wall.x2 - wall.x1;
    const wy = wall.y2 - wall.y1;
    const wLen2 = wx * wx + wy * wy;
    if (wLen2 === 0) continue;
    const t = Math.max(0, Math.min(1,
      ((x - wall.x1) * wx + (y - wall.y1) * wy) / wLen2));
    const cx = wall.x1 + t * wx;
    const cy = wall.y1 + t * wy;
    const dx = x - cx;
    const dy = y - cy;
    if (dx * dx + dy * dy < 900) return; // too close
  }

  // Check budget
  if (getRemainingCount(currentTool) <= 0) return;

  // Check if too close to existing element
  for (const el of placedElements) {
    const dx = el.x - x;
    const dy = el.y - y;
    if (dx * dx + dy * dy < 1600) return;
  }

  placedElements.push({
    x, y,
    type: currentTool,
    strength: 50,
    id: nextId++
  });

  updateCounts();
});

// Tool selection
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + tool).classList.add('active');
}

document.getElementById('btn-source').addEventListener('click', () => setTool('source'));
document.getElementById('btn-sink').addEventListener('click', () => setTool('sink'));
document.getElementById('btn-erase').addEventListener('click', () => setTool('erase'));
document.getElementById('btn-reset').addEventListener('click', () => {
  placedElements = [];
  particles = [];
  gateFlowAccum = gates.map(() => 0);
  gates.forEach(g => { g.flow = 0; g.satisfied = false; });
  levelComplete = false;
  completionShown = false;
  document.getElementById('completion-overlay').classList.remove('visible');
  updateCounts();
});

document.getElementById('next-btn').addEventListener('click', () => {
  currentLevel = (currentLevel + 1) % levels.length;
  loadLevel();
});

document.getElementById('start-btn').addEventListener('click', () => {
  gameStarted = true;
  document.getElementById('intro-overlay').classList.add('hidden');
  loadLevel();
});

// ── Game Loop ──
function gameLoop(time) {
  drawBackground();

  if (gameStarted) {
    drawVectorField();
    drawWalls();
    drawGates(time);
    drawPlacedElements(time);

    spawnParticles();
    updateParticles();
    drawParticles();
    checkCompletion();
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
