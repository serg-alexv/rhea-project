site_name: Play AI Documentation
site_description: Play AI allows you to leverage AI within Play for macOS to design and prototype
site_author: Createwithplay
site_url: https://docs.createwithplay.com

nav:
  - Play AI: docs.md

theme:
  name: material
  palette:
    - scheme: default
      primary: #22d691
      accent: #22d691
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: #22d691
      accent: #22d691
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.share

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://youtube.com
    - icon: fontawesome/brands/instagram
      link: https://instagram.com
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com

copyright: Powered by Createwithplay