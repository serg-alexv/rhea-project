<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhea Ontology Explorer</title>
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2235;
  --bg-card-hover: #1e2a42;
  --border: #2d3a52;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #6366f1;
  --accent-glow: rgba(99,102,241,0.3);
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --cyan: #06b6d4;
  --purple: #a855f7;
  --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
}

/* --- Layout --- */
.app {
  display: grid;
  grid-template-columns: 280px 1fr 340px;
  grid-template-rows: 56px 1fr;
  height: 100vh;
}

header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  gap: 16px;
}

header h1 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--accent);
}

header .status-bar {
  display: flex;
  gap: 16px;
  margin-left: auto;
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
}

header .status-bar .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  animation: pulse 2s infinite;
}

.dot.green { background: var(--green); }
.dot.amber { background: var(--amber); }
.dot.red { background: var(--red); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* --- Sidebar --- */
.sidebar {
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}

.sidebar h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.sidebar .section { margin-bottom: 24px; }

.plugin-card, .team-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 13px;
}

.plugin-card:hover, .team-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent);
}

.plugin-card .name { font-weight: 600; color: var(--cyan); }
.plugin-card .hooks { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* --- Main canvas --- */
.main-canvas {
  position: relative;
  overflow: hidden;
}

#graph-canvas {
  width: 100%;
  height: 100%;
  background: var(--bg-primary);
}

/* Floating controls on canvas */
.canvas-controls {
  position: absolute;
  top: 16px;
  left: 16px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

.canvas-controls button {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all 0.15s;
}

.canvas-controls button:hover {
  background: var(--accent);
  border-color: var(--accent);
}

.canvas-controls button.active {
  background: var(--accent);
  border-color: var(--accent);
}

/* --- Right panel --- */
.right-panel {
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}

.right-panel h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

/* --- Forms --- */
.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color 0.15s;
}

.form-group input:focus, .form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.form-group textarea { resize: vertical; min-height: 80px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  font-family: var(--font-sans);
}

.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: #5558e6; }

.btn-danger {
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
}
.btn-danger:hover { background: rgba(239,68,68,0.1); }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.btn-ghost:hover { border-color: var(--text-secondary); }

.btn-sm { padding: 4px 10px; font-size: 11px; }

/* --- Hypothesis detail --- */
.h-detail {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 12px;
}

.h-detail .title { font-weight: 600; color: var(--text-primary); font-size: 14px; }
.h-detail .domain { font-size: 11px; color: var(--cyan); margin-top: 2px; }
.h-detail .statement { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.5; }

.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-proposed { background: rgba(99,102,241,0.2); color: var(--accent); }
.status-under_review { background: rgba(245,158,11,0.2); color: var(--amber); }
.status-accepted { background: rgba(34,197,94,0.2); color: var(--green); }
.status-rejected { background: rgba(239,68,68,0.2); color: var(--red); }
.status-red_team_attack { background: rgba(239,68,68,0.15); color: #f87171; }

/* --- Verification meter --- */
.verification-meter {
  display: flex;
  gap: 4px;
  margin-top: 10px;
}

.v-layer {
  flex: 1;
  background: var(--bg-primary);
  border-radius: 4px;
  padding: 6px 8px;
  text-align: center;
}

.v-layer .label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); }
.v-layer .value { font-size: 14px; font-weight: 700; margin-top: 2px; font-family: var(--font-mono); }
.v-layer.pass .value { color: var(--green); }
.v-layer.fail .value { color: var(--red); }
.v-layer.pending .value { color: var(--amber); }

/* --- Log panel --- */
.log-entry {
  font-size: 12px;
  font-family: var(--font-mono);
  padding: 6px 8px;
  border-left: 2px solid var(--border);
  margin-bottom: 4px;
  color: var(--text-secondary);
}

.log-entry.action-propose { border-color: var(--accent); }
.log-entry.action-verify { border-color: var(--amber); }
.log-entry.action-explore { border-color: var(--cyan); }

/* --- Explore modal --- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 560px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal h2 {
  font-size: 16px;
  margin-bottom: 16px;
  color: var(--text-primary);
}

/* --- Scrollbar --- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* --- Responsive fallback --- */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar, .right-panel { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header>
    <h1>◈ RHEA ONTOLOGY EXPLORER</h1>
    <div style="font-size:12px;color:var(--text-muted)">v0.1 — Cross-Disciplinary Hypothesis Engine</div>
    <div class="status-bar">
      <span><span class="dot green" id="dot-engine"></span>Engine</span>
      <span><span class="dot amber" id="dot-bridge"></span>Bridge</span>
      <span id="stats-display">—</span>
    </div>
  </header>

  <!-- Left sidebar: plugins + teams -->
  <div class="sidebar">
    <div class="section">
      <h2>Mathematical Universes</h2>
      <div id="plugins-list"></div>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="showAddPlugin()">
        + Add Plugin
      </button>
    </div>

    <div class="section">
      <h2>Agent Teams</h2>
      <div id="teams-list"></div>
    </div>

    <div class="section">
      <h2>Exploration Log</h2>
      <div id="log-entries" style="max-height:200px;overflow-y:auto"></div>
    </div>
  </div>

  <!-- Main canvas: hypothesis graph visualization -->
  <div class="main-canvas">
    <div class="canvas-controls">
      <button onclick="openExploreModal()">⚡ Explore</button>
      <button onclick="openProposeModal()">+ Propose</button>
      <button onclick="refreshGraph()">↻ Refresh</button>
      <button onclick="runFullVerification()" class="btn-danger" style="border-radius:6px">🔴 Red Team All</button>
    </div>
    <canvas id="graph-canvas"></canvas>
  </div>

  <!-- Right panel: detail + propose form -->
  <div class="right-panel">
    <div class="section">
      <h2>Selected Hypothesis</h2>
      <div id="hypothesis-detail">
        <div style="color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center">
          Click a node in the graph to inspect it
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Quick Propose</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="q-title" placeholder="Short descriptive title">
      </div>
      <div class="form-group">
        <label>Statement</label>
        <textarea id="q-statement" placeholder="The precise hypothesis..."></textarea>
      </div>
      <div class="form-group">
        <label>Domain</label>
        <select id="q-domain"><option value="general">General</option></select>
      </div>
      <div class="form-group">
        <label>Tags (comma-separated)</label>
        <input type="text" id="q-tags" placeholder="topology, conjecture, wild">
      </div>
      <button class="btn btn-primary" onclick="quickPropose()">Propose & Verify</button>
    </div>

    <div class="section">
      <h2>Verification Queue</h2>
      <div id="verification-queue"></div>
    </div>
  </div>
</div>

<!-- Explore Modal -->
<div class="modal-overlay" id="explore-modal">
  <div class="modal">
    <h2>⚡ Cross-Disciplinary Exploration</h2>
    <div class="form-group">
      <label>Seed Idea</label>
      <textarea id="explore-seed" placeholder="Describe the phenomenon, question, or wild idea to explore across mathematical universes..." style="min-height:100px"></textarea>
    </div>
    <div class="form-group">
      <label>Exploration Depth</label>
      <select id="explore-depth">
        <option value="1">Shallow (1 level)</option>
        <option value="3" selected>Standard (3 levels)</option>
        <option value="5">Deep (5 levels)</option>
        <option value="10">Extreme (10 levels)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Target Universes (leave empty for all)</label>
      <div id="explore-domains" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-primary" onclick="runExploration()">Launch Exploration</button>
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<!-- Propose Modal -->
<div class="modal-overlay" id="propose-modal">
  <div class="modal">
    <h2>+ Propose Hypothesis</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="p-title" placeholder="Compact title">
    </div>
    <div class="form-group">
      <label>Formal Statement</label>
      <textarea id="p-statement" placeholder="The precise claim to be tested..." style="min-height:120px"></textarea>
    </div>
    <div class="form-group">
      <label>Mathematical Universe / Domain</label>
      <select id="p-domain"><option value="general">General</option></select>
    </div>
    <div class="form-group">
      <label>Parent Hypothesis (optional)</label>
      <select id="p-parent"><option value="">None (root hypothesis)</option></select>
    </div>
    <div class="form-group">
      <label>Tags</label>
      <input type="text" id="p-tags" placeholder="wild, conjecture, cross-domain">
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-primary" onclick="submitProposal()">Propose</button>
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<script>
// =========================================================================
// Rhea Ontology Explorer — Client
// =========================================================================

const API = '';

// --- State ---
let graphData = { nodes: [], edges: [] };
let selectedNode = null;
let plugins = {};
let canvas, ctx;
let panX = 0, panY = 0, zoom = 1;
let dragging = false, dragStart = {x:0, y:0};
let nodePositions = {};

// --- Init ---
document.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('graph-canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  canvas.addEventListener('mousedown', onCanvasMouseDown);
  canvas.addEventListener('mousemove', onCanvasMouseMove);
  canvas.addEventListener('mouseup', onCanvasMouseUp);
  canvas.addEventListener('wheel', onCanvasWheel);
  canvas.addEventListener('click', onCanvasClick);

  refresh();
  setInterval(refresh, 10000);
});

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  drawGraph();
}

// --- API calls ---
async function api(path, method='GET', body=null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(API + path, opts);
    return await res.json();
  } catch(e) {
    console.error('API error:', path, e);
    return { error: e.message };
  }
}

async function refresh() {
  const [status, graph, pluginInfo] = await Promise.all([
    api('/api/status'),
    api('/api/graph'),
    api('/api/plugins'),
  ]);

  if (!status.error) {
    document.getElementById('stats-display').textContent =
      `${status.graph?.total || 0} hypotheses | ${status.graph?.edges || 0} edges`;
    document.getElementById('dot-engine').className = 'dot green';
  }

  if (!graph.error) {
    graphData = graph;
    layoutGraph();
    drawGraph();
  }

  if (!pluginInfo.error) {
    plugins = pluginInfo;
    renderPlugins();
    updateDomainSelects();
  }
}

async function refreshGraph() {
  const graph = await api('/api/graph');
  if (!graph.error) {
    graphData = graph;
    layoutGraph();
    drawGraph();
  }
}

// --- Plugin rendering ---
function renderPlugins() {
  const container = document.getElementById('plugins-list');
  if (Object.keys(plugins).length === 0) {
    container.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px">No plugins loaded yet. Add mathematical universe plugins to begin.</div>';
    return;
  }
  container.innerHTML = Object.entries(plugins).map(([name, info]) => `
    <div class="plugin-card" onclick="selectPlugin('${name}')">
      <div class="name">${name}</div>
      <div class="hooks">${info.hooks?.join(', ') || 'no hooks'}</div>
    </div>
  `).join('');
}

function updateDomainSelects() {
  const domains = Object.keys(plugins);
  domains.unshift('general');
  ['q-domain', 'p-domain'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = domains.map(d => `<option value="${d}">${d}</option>`).join('');
  });
}

// --- Graph layout (force-directed) ---
function layoutGraph() {
  const nodes = graphData.nodes || [];
  const edges = graphData.edges || [];
  const W = canvas.width / window.devicePixelRatio;
  const H = canvas.height / window.devicePixelRatio;

  // Initialize positions for new nodes
  nodes.forEach(n => {
    if (!nodePositions[n.id]) {
      nodePositions[n.id] = {
        x: W/2 + (Math.random()-0.5) * W * 0.6,
        y: H/2 + (Math.random()-0.5) * H * 0.6,
        vx: 0, vy: 0
      };
    }
  });

  // Simple force simulation (10 iterations)
  for (let iter = 0; iter < 10; iter++) {
    // Repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodePositions[nodes[i].id];
        const b = nodePositions[nodes[j].id];
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.max(Math.sqrt(dx*dx + dy*dy), 1);
        let force = 8000 / (dist * dist);
        a.vx -= (dx/dist) * force;
        a.vy -= (dy/dist) * force;
        b.vx += (dx/dist) * force;
        b.vy += (dy/dist) * force;
      }
    }
    // Attraction along edges
    edges.forEach(e => {
      const a = nodePositions[e.from];
      const b = nodePositions[e.to];
      if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      let force = (dist - 120) * 0.01;
      a.vx += (dx/dist) * force;
      a.vy += (dy/dist) * force;
      b.vx -= (dx/dist) * force;
      b.vy -= (dy/dist) * force;
    });
    // Center gravity
    nodes.forEach(n => {
      const p = nodePositions[n.id];
      p.vx += (W/2 - p.x) * 0.001;
      p.vy += (H/2 - p.y) * 0.001;
    });
    // Apply velocities with damping
    nodes.forEach(n => {
      const p = nodePositions[n.id];
      p.vx *= 0.8;
      p.vy *= 0.8;
      p.x += p.vx;
      p.y += p.vy;
    });
  }
}

// --- Graph drawing ---
const STATUS_COLORS = {
  proposed: '#6366f1',
  under_review: '#f59e0b',
  accepted: '#22c55e',
  rejected: '#ef4444',
  red_team_attack: '#f87171',
  consensus_pending: '#fbbf24',
  formal_check: '#a855f7',
  suspended: '#64748b',
};

const DOMAIN_SHAPES = {};

function drawGraph() {
  if (!ctx) return;
  const W = canvas.width / window.devicePixelRatio;
  const H = canvas.height / window.devicePixelRatio;

  ctx.save();
  ctx.clearRect(0, 0, W, H);

  // Background grid
  ctx.strokeStyle = '#1a2235';
  ctx.lineWidth = 0.5;
  const gridSize = 40;
  for (let x = (panX % gridSize); x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = (panY % gridSize); y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);

  // Draw edges
  (graphData.edges || []).forEach(e => {
    const a = nodePositions[e.from];
    const b = nodePositions[e.to];
    if (!a || !b) return;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = e.type === 'cross_domain' ? 'rgba(168,85,247,0.3)' :
                      e.type === 'derivation' ? 'rgba(99,102,241,0.4)' :
                      'rgba(100,116,139,0.2)';
    ctx.lineWidth = e.type === 'cross_domain' ? 1.5 : 1;
    ctx.setLineDash(e.type === 'cross_domain' ? [4,4] : []);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Draw nodes
  (graphData.nodes || []).forEach(n => {
    const p = nodePositions[n.id];
    if (!p) return;
    const r = 18 + (n.evidence_for || 0) * 2;
    const color = STATUS_COLORS[n.status] || '#6366f1';
    const isSelected = selectedNode === n.id;

    // Glow
    if (isSelected) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 8, 0, Math.PI * 2);
      ctx.fillStyle = color.replace(')', ',0.2)').replace('rgb', 'rgba');
      ctx.fill();
    }

    // Node body
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color + '33';
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = isSelected ? 3 : 1.5;
    ctx.stroke();

    // Label
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const label = n.label || n.id;
    ctx.fillText(label.length > 20 ? label.slice(0,18)+'…' : label, p.x, p.y + r + 4);

    // Domain badge
    if (n.domain && n.domain !== 'general') {
      ctx.font = '9px monospace';
      ctx.fillStyle = '#06b6d4';
      ctx.fillText(n.domain, p.x, p.y + r + 18);
    }
  });

  // Empty state
  if ((graphData.nodes || []).length === 0) {
    ctx.fillStyle = '#64748b';
    ctx.font = '16px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No hypotheses yet.', W/(2*zoom), H/(2*zoom));
    ctx.font = '13px -apple-system, sans-serif';
    ctx.fillText('Click "Explore" or "Propose" to begin.', W/(2*zoom), H/(2*zoom) + 24);
  }

  ctx.restore();
}

// --- Canvas interaction ---
function onCanvasMouseDown(e) {
  dragging = true;
  dragStart = { x: e.clientX - panX, y: e.clientY - panY };
}

function onCanvasMouseMove(e) {
  if (dragging) {
    panX = e.clientX - dragStart.x;
    panY = e.clientY - dragStart.y;
    drawGraph();
  }
}

function onCanvasMouseUp() { dragging = false; }

function onCanvasWheel(e) {
  e.preventDefault();
  zoom *= e.deltaY < 0 ? 1.1 : 0.9;
  zoom = Math.max(0.2, Math.min(5, zoom));
  drawGraph();
}

function onCanvasClick(e) {
  if (dragging) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left - panX) / zoom;
  const my = (e.clientY - rect.top - panY) / zoom;

  let clicked = null;
  (graphData.nodes || []).forEach(n => {
    const p = nodePositions[n.id];
    if (!p) return;
    const r = 18 + (n.evidence_for || 0) * 2;
    const dx = mx - p.x, dy = my - p.y;
    if (dx*dx + dy*dy < r*r) clicked = n;
  });

  if (clicked) {
    selectedNode = clicked.id;
    showHypothesisDetail(clicked);
  } else {
    selectedNode = null;
    document.getElementById('hypothesis-detail').innerHTML =
      '<div style="color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center">Click a node to inspect</div>';
  }
  drawGraph();
}

// --- Detail panel ---
async function showHypothesisDetail(node) {
  const data = await api(`/api/hypothesis/${node.id}`);
  if (data.error) return;

  const statusClass = `status-${data.status}`;
  const forCount = (data.evidence_for || []).length;
  const againstCount = (data.evidence_against || []).length;

  document.getElementById('hypothesis-detail').innerHTML = `
    <div class="h-detail">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="title">${data.title || '(untitled)'}</div>
        <span class="status-badge ${statusClass}">${data.status}</span>
      </div>
      <div class="domain">◈ ${data.domain}</div>
      <div class="statement">${data.statement}</div>

      <div class="verification-meter">
        <div class="v-layer ${data.consensus_score > 0.7 ? 'pass' : data.consensus_score > 0 ? 'pending' : 'pending'}">
          <div class="label">Consensus</div>
          <div class="value">${data.consensus_score > 0 ? (data.consensus_score * 100).toFixed(0) + '%' : '—'}</div>
        </div>
        <div class="v-layer ${data.formal_proof_status === 'verified' ? 'pass' : data.formal_proof_status === 'failed' ? 'fail' : 'pending'}">
          <div class="label">Formal</div>
          <div class="value">${data.formal_proof_status || '—'}</div>
        </div>
        <div class="v-layer ${data.red_team_score > 0.7 ? 'pass' : data.red_team_score > 0 ? 'fail' : 'pending'}">
          <div class="label">Red Team</div>
          <div class="value">${data.red_team_score > 0 ? (data.red_team_score * 100).toFixed(0) + '%' : '—'}</div>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:12px;font-size:12px">
        <span style="color:var(--green)">▲ ${forCount} supporting</span>
        <span style="color:var(--red)">▼ ${againstCount} attacking</span>
      </div>

      <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
        ${(data.tags || []).map(t => `<span style="background:var(--bg-primary);padding:2px 8px;border-radius:4px;font-size:10px;color:var(--text-muted)">${t}</span>`).join('')}
      </div>

      <div style="display:flex;gap:6px;margin-top:14px">
        <button class="btn btn-primary btn-sm" onclick="verifyHypothesis('${data.id}')">Verify</button>
        <button class="btn btn-danger btn-sm" onclick="redTeamAttack('${data.id}')">Red Team</button>
        <button class="btn btn-ghost btn-sm" onclick="deriveFrom('${data.id}')">Derive</button>
      </div>
    </div>
  `;
}

// --- Actions ---
async function quickPropose() {
  const title = document.getElementById('q-title').value;
  const statement = document.getElementById('q-statement').value;
  const domain = document.getElementById('q-domain').value;
  const tags = document.getElementById('q-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  if (!statement) return;

  const result = await api('/api/propose', 'POST', { title, statement, domain, tags });
  if (!result.error) {
    document.getElementById('q-title').value = '';
    document.getElementById('q-statement').value = '';
    document.getElementById('q-tags').value = '';
    await refreshGraph();
    // Auto-verify
    await api('/api/verify', 'POST', { hypothesis_id: result.id });
    await refreshGraph();
  }
}

async function verifyHypothesis(id) {
  const result = await api('/api/verify', 'POST', { hypothesis_id: id });
  addLogEntry('verify', `Verification launched for ${id}`);
  await refreshGraph();
}

async function redTeamAttack(id) {
  const result = await api('/api/red-team/attack', 'POST', { hypothesis_id: id, num_attackers: 3 });
  addLogEntry('verify', `Red team attack on ${id}: ${result.strategies?.length || 0} strategies`);
}

function deriveFrom(parentId) {
  document.getElementById('p-parent').value = parentId;
  document.getElementById('propose-modal').classList.add('active');
}

async function submitProposal() {
  const result = await api('/api/propose', 'POST', {
    title: document.getElementById('p-title').value,
    statement: document.getElementById('p-statement').value,
    domain: document.getElementById('p-domain').value,
    parent_id: document.getElementById('p-parent').value || null,
    tags: document.getElementById('p-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
  });
  closeModals();
  await refreshGraph();
}

async function runExploration() {
  const seed = document.getElementById('explore-seed').value;
  const depth = parseInt(document.getElementById('explore-depth').value);
  if (!seed) return;
  const result = await api('/api/explore', 'POST', { seed, depth });
  addLogEntry('explore', `Exploration: ${result.generated || 0} hypotheses from seed`);
  closeModals();
  await refreshGraph();
}

async function runFullVerification() {
  const nodes = graphData.nodes || [];
  const unverified = nodes.filter(n => n.status === 'proposed');
  for (const n of unverified) {
    await api('/api/verify', 'POST', { hypothesis_id: n.id });
  }
  addLogEntry('verify', `Full verification on ${unverified.length} hypotheses`);
  await refreshGraph();
}

// --- Modals ---
function openExploreModal() {
  document.getElementById('explore-modal').classList.add('active');
  // Populate domain checkboxes
  const container = document.getElementById('explore-domains');
  const domains = Object.keys(plugins);
  container.innerHTML = domains.map(d => `
    <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);cursor:pointer">
      <input type="checkbox" value="${d}" checked> ${d}
    </label>
  `).join('');
}

function openProposeModal() {
  document.getElementById('propose-modal').classList.add('active');
  // Populate parent select
  const sel = document.getElementById('p-parent');
  sel.innerHTML = '<option value="">None (root hypothesis)</option>';
  (graphData.nodes || []).forEach(n => {
    sel.innerHTML += `<option value="${n.id}">${n.label || n.id}</option>`;
  });
}

function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
}

function showAddPlugin() {
  alert('Add plugins by placing .py files in rhea-ontology-explorer/plugins/\nEach plugin should export a register_plugin(engine) function.');
}

function selectPlugin(name) {
  // Could expand to show plugin detail panel
  console.log('Selected plugin:', name, plugins[name]);
}

// --- Log ---
function addLogEntry(action, text) {
  const container = document.getElementById('log-entries');
  const time = new Date().toLocaleTimeString();
  container.innerHTML = `<div class="log-entry action-${action}"><span style="color:var(--text-muted)">${time}</span> ${text}</div>` + container.innerHTML;
}
</script>
