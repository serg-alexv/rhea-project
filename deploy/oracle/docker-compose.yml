# deploy/oracle/docker-compose.yml
# Rhea Oracle Cloud Always-Free VM stack
#
# Run with setup-vm.sh (handles env file, data dirs, systemd).
# Or manually:
#   docker compose --env-file ~/.env.rhea up -d
#
# Required env vars (in ~/.env.rhea):
#   REDIS_PASSWORD        — Redis AUTH secret
#   BACKUP_API_IMAGE      — Docker image for rhead (e.g. ghcr.io/rhea/rhead:latest)
#   ENABLE_MONITORING     — "1" to start Prometheus + Grafana (default: "0")

version: "3.9"

###############################################################################
# Networks
###############################################################################
networks:
  rhea-internal:
    driver: bridge

###############################################################################
# Volumes (named, backed by ~/rhea-data/ bind mounts for easy inspection)
###############################################################################
volumes:
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/rhea-data/redis

  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/rhea-data/prometheus

  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/rhea-data/grafana

###############################################################################
# Services
###############################################################################
services:

  # ---------------------------------------------------------------------------
  # CRITICAL: Redis 7 — persistence + auth + memory cap
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rhea-redis
    restart: unless-stopped
    networks:
      - rhea-internal
    ports:
      - "6379:6379"           # exposed to internet; secured by AUTH + firewall
    command: >
      redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ${HOME}/rhea-data/redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      # Not used directly by Redis; useful for healthcheck scripts on the host
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    sysctls:
      # Silence Redis warning about overcommit
      net.core.somaxconn: 1024
    deploy:
      resources:
        limits:
          # Redis is the priority service — generous allowance on 24GB VM
          memory: 5G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Backup API — FastAPI fallback if Google Cloud Run is unreachable
  # Same image as the Cloud Run deployment; runs on port 8000.
  # ---------------------------------------------------------------------------
  backup-api:
    image: ${BACKUP_API_IMAGE:-ghcr.io/rhea/rhead:latest}
    container_name: rhea-backup-api
    restart: unless-stopped
    networks:
      - rhea-internal
    ports:
      - "8000:8000"
    environment:
      # Redis points to the local redis container via internal network
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # Pass through all other Rhea secrets from the host env (set in ~/.env.rhea)
      - TRIBUNAL_API_KEYS=${TRIBUNAL_API_KEYS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Prometheus — metrics scraping (OPTIONAL)
  # Uncomment the entire block to enable.
  # ---------------------------------------------------------------------------
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: rhea-prometheus
  #   restart: unless-stopped
  #   networks:
  #     - rhea-internal
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - prometheus-data:/prometheus
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--storage.tsdb.path=/prometheus"
  #     - "--storage.tsdb.retention.time=30d"
  #     - "--web.enable-lifecycle"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1G

  # ---------------------------------------------------------------------------
  # Grafana — dashboards (OPTIONAL, depends on Prometheus)
  # Uncomment together with Prometheus block above.
  # Default login: admin / changeme (change via GF_SECURITY_ADMIN_PASSWORD)
  # ---------------------------------------------------------------------------
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: rhea-grafana
  #   restart: unless-stopped
  #   networks:
  #     - rhea-internal
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=changeme
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #     - GF_SERVER_ROOT_URL=http://%(domain)s:3001
