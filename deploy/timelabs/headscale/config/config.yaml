## Headscale Configuration — Rhea Network
## Replaces Tailscale's cloud coordination server.
##
## This controls:
##   - Node registration and key exchange
##   - ACL policies (who can talk to whom)
##   - DNS configuration (MagicDNS)
##   - DERP relay map

server_url: https://headscale.timelabs.ru
listen_addr: 0.0.0.0:443
metrics_listen_addr: 0.0.0.0:8080

# gRPC for CLI management
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

# Noise protocol for node registration (Tailscale protocol)
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# IP allocation for mesh nodes
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

# DERP — our own relay server
derp:
  server:
    enabled: false  # Using separate container
  urls: []
  paths:
    - /etc/headscale/derp.yaml
  auto_update_enabled: false

# Database
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

# DNS — MagicDNS equivalent
dns:
  magic_dns: true
  base_domain: rhea.mesh
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
  extra_records: []

# Node expiry
node_update_check_interval: 10s

# Logging
log:
  level: info

# ACL policy file
policy:
  path: /etc/headscale/acl.yaml
  mode: file

# TLS — Let's Encrypt or manual certs
tls_cert_path: ""
tls_key_path: ""
# For Let's Encrypt:
# tls_letsencrypt_hostname: headscale.timelabs.ru
# tls_letsencrypt_cache_dir: /var/lib/headscale/cache
# tls_letsencrypt_challenge_type: HTTP-01
