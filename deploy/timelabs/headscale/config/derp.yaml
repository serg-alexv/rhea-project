## DERP Relay Map — Rhea's own relay infrastructure
## No Tailscale relays used. Own infrastructure only.
##
## DERP relays are used when direct peer-to-peer WireGuard
## connections fail (NAT, firewall). The relay forwards
## encrypted WireGuard packets between peers.

