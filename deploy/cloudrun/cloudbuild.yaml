steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - '--tag'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}'
      - '--tag'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'

  # Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--port'
      - '8000'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - >-
        OPENAI_API_KEY=${_OPENAI_API_KEY},
        ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY},
        GEMINI_API_KEY=${_GEMINI_API_KEY},
        OPENROUTER_API_KEY=${_OPENROUTER_API_KEY},
        REDIS_URL=${_REDIS_URL}

substitutions:
  _REGION: us-central1
  _REPO: rhea
  _SERVICE: rhea-backend

# Required substitutions passed at build time (via deploy.sh or Cloud Build trigger):
#   _OPENAI_API_KEY, _ANTHROPIC_API_KEY, _GEMINI_API_KEY,
#   _OPENROUTER_API_KEY, _REDIS_URL

options:
  logging: CLOUD_LOGGING_ONLY
