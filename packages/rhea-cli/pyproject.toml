[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhea-cli"
version = "0.1.0"
description = "Unified CLI for Rhea agent coordination OS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "timelabs npo"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.28",
]

[project.scripts]
rhea = "rhea_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/timelabs/rhea-cli"
Repository = "https://github.com/timelabs/rhea-cli"
Issues = "https://github.com/timelabs/rhea-cli/issues"

[tool.setuptools.packages.find]
include = ["rhea_cli*"]
