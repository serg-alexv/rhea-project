[project]
name = "rhea-clipboard"
version = "0.1.0"
description = "Cross-device clipboard sync with privacy controls"
requires-python = ">=3.10"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "requests>=2.28",
    "sseclient-py>=1.8",
    "pyperclip>=1.8",
]

[project.scripts]
rhea-clip = "rhea_clipboard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
