<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhea Ontology Explorer</title>
<style>
:root {
  --bg: #0a0e17; --bg2: #111827; --bg3: #1a2235; --bg3h: #1e2a42;
  --border: #2d3a52; --t1: #e2e8f0; --t2: #94a3b8; --t3: #64748b;
  --accent: #6366f1; --green: #22c55e; --red: #ef4444; --amber: #f59e0b;
  --cyan: #06b6d4; --purple: #a855f7;
  --mono: 'SF Mono','Fira Code',monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);overflow-x:hidden}
.app{display:grid;grid-template-columns:260px 1fr 320px;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);gap:12px}
header h1{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.5px}
header .info{margin-left:auto;font-size:11px;color:var(--t3);font-family:var(--mono)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:12px}
.sidebar h2{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);margin:12px 0 8px}
.pcard{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:12px;transition:all .15s}
.pcard:hover{background:var(--bg3h);border-color:var(--accent)}
.pcard .nm{font-weight:600;color:var(--cyan)}
.pcard .hk{font-size:10px;color:var(--t3);margin-top:2px}
.main{position:relative;overflow:hidden}
canvas{width:100%;height:100%;background:var(--bg)}
.ctrls{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:10}
.ctrls button{background:var(--bg3);border:1px solid var(--border);color:var(--t1);padding:6px 12px;border-radius:5px;font-size:11px;cursor:pointer;font-family:var(--sans)}
.ctrls button:hover{background:var(--accent);border-color:var(--accent)}
.legend{position:absolute;bottom:12px;left:12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:10px;display:flex;gap:12px;z-index:10}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.rpanel{background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;padding:12px}
.rpanel h2{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);margin:12px 0 8px}
.hdet{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px}
.hdet .tl{font-weight:600;font-size:13px}
.hdet .dm{font-size:10px;color:var(--cyan);margin-top:2px}
.hdet .st{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.5}
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.b-proposed{background:rgba(99,102,241,.2);color:var(--accent)}
.b-under_review{background:rgba(245,158,11,.2);color:var(--amber)}
.b-accepted{background:rgba(34,197,94,.2);color:var(--green)}
.b-rejected{background:rgba(239,68,68,.2);color:var(--red)}
.vmeter{display:flex;gap:3px;margin-top:8px}
.vl{flex:1;background:var(--bg);border-radius:3px;padding:4px 6px;text-align:center}
.vl .lb{font-size:8px;text-transform:uppercase;color:var(--t3)}
.vl .vv{font-size:12px;font-weight:700;margin-top:1px;font-family:var(--mono)}
.vl.pass .vv{color:var(--green)}.vl.fail .vv{color:var(--red)}.vl.pend .vv{color:var(--amber)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tag{background:var(--bg);padding:1px 6px;border-radius:3px;font-size:9px;color:var(--t3)}
.evlist{margin-top:8px;font-size:11px}
.ev{padding:4px 6px;border-left:2px solid var(--border);margin-bottom:3px;color:var(--t2)}
.ev.support{border-color:var(--green)}.ev.attack{border-color:var(--red)}
.vlog{font-size:11px;font-family:var(--mono);margin-top:4px}
.vlog .entry{padding:3px 6px;border-left:2px solid var(--accent);margin-bottom:3px;color:var(--t2)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar,.rpanel{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>◈ RHEA ONTOLOGY EXPLORER</h1>
<div style="font-size:11px;color:var(--t3)">v0.1 — Cross-Disciplinary Hypothesis Engine</div>
<div class="info" id="stats"></div>
</header>

<div class="sidebar">
<h2>Mathematical Universes</h2>
<div id="plugins"></div>
<h2>Verification Log</h2>
<div id="vlog" class="vlog"></div>
</div>

<div class="main">
<div class="ctrls">
<button onclick="resetView()">↻ Reset View</button>
<button onclick="toggleLabels()">Labels</button>
<button onclick="toggleEdges()">Edges</button>
<button onclick="highlightUnverified()">⚡ Unverified</button>
</div>
<div class="legend">
<span><span class="dot" style="background:#6366f1"></span>Proposed</span>
<span><span class="dot" style="background:#f59e0b"></span>Review</span>
<span><span class="dot" style="background:#22c55e"></span>Accepted</span>
<span><span class="dot" style="background:#ef4444"></span>Rejected</span>
<span style="margin-left:8px;color:var(--t3)">— derivation</span>
<span style="color:var(--purple)">--- cross-domain</span>
</div>
<canvas id="cv"></canvas>
</div>

<div class="rpanel">
<h2>Selected Hypothesis</h2>
<div id="detail"><div style="color:var(--t3);font-size:12px;padding:16px 0;text-align:center">Click a node to inspect</div></div>
<h2>Graph Stats</h2>
<div id="gstats" style="font-size:11px;color:var(--t2)"></div>
</div>
</div>

  cv.addEventListener('mousemove',e=>{if(drag){panX=e.clientX-ds.x;panY=e.clientY-ds.y;draw()}});
  cv.addEventListener('mouseup',()=>drag=false);
  cv.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.1:.9;zoom=Math.max(.2,Math.min(5,zoom));draw()});
  cv.addEventListener('click',onClick);
  layout();renderPlugins();renderStats();renderVlog();draw();
});

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  W=r.width;H=r.height;
  cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  draw();
}

function layout(){
  nodes.forEach((n,i)=>{
    const angle=2*Math.PI*i/nodes.length;
    const r=Math.min(W,H)*0.35;
    // Group by domain
    const domains=[...new Set(nodes.map(n=>n.domain))];
    const di=domains.indexOf(n.domain);
    const groupAngle=2*Math.PI*di/domains.length;
    const spread=0.4;
    const na=groupAngle+spread*(Math.random()-.5);
    const nr=r*(0.5+Math.random()*0.5);
    pos[n.id]={x:W/2+Math.cos(na)*nr,y:H/2+Math.sin(na)*nr,vx:0,vy:0};
  });
  // Force sim
  for(let iter=0;iter<80;iter++){
    nodes.forEach((a,i)=>{
      nodes.forEach((b,j)=>{
        if(i>=j)return;
        const pa=pos[a.id],pb=pos[b.id];
        let dx=pb.x-pa.x,dy=pb.y-pa.y;
        let d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
        let f=5000/(d*d);
        pa.vx-=(dx/d)*f;pa.vy-=(dy/d)*f;
        pb.vx+=(dx/d)*f;pb.vy+=(dy/d)*f;
      });
    });
    edges.forEach(e=>{
      const a=pos[e.from],b=pos[e.to];
      if(!a||!b)return;
      let dx=b.x-a.x,dy=b.y-a.y;
      let d=Math.sqrt(dx*dx+dy*dy)||1;
      let f=(d-100)*0.008;
      a.vx+=(dx/d)*f;a.vy+=(dy/d)*f;
      b.vx-=(dx/d)*f;b.vy-=(dy/d)*f;
    });
    nodes.forEach(n=>{
      const p=pos[n.id];
      p.vx+=(W/2-p.x)*0.001;p.vy+=(H/2-p.y)*0.001;
      p.vx*=0.85;p.vy*=0.85;
      p.x+=p.vx;p.y+=p.vy;
    });
  }
}

function draw(){
  if(!cx)return;
  cx.save();cx.clearRect(0,0,W,H);
  // Grid
  cx.strokeStyle='#111827';cx.lineWidth=.5;
  for(let x=(panX%40);x<W;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
  for(let y=(panY%40);y<H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}

  cx.translate(panX,panY);cx.scale(zoom,zoom);

  if(showEdges){
    edges.forEach(e=>{
      const a=pos[e.from],b=pos[e.to];
      if(!a||!b)return;
      cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);
      cx.strokeStyle=e.type==='cross_domain'?'rgba(168,85,247,0.15)':'rgba(99,102,241,0.12)';
      cx.lineWidth=e.type==='cross_domain'?1.2:0.8;
      cx.setLineDash(e.type==='cross_domain'?[3,3]:[]);
      cx.stroke();cx.setLineDash([]);
    });
  }

  nodes.forEach(n=>{
    const p=pos[n.id];if(!p)return;
    const r=14+(n.evidence_for||0)*1.5;
    const col=highlightMode&&n.status==='proposed'?'#ff6b6b':(DOMAIN_COLORS[n.domain]||COLORS[n.status]||'#6366f1');
    const isSel=sel===n.id;

    if(isSel){
      cx.beginPath();cx.arc(p.x,p.y,r+10,0,Math.PI*2);
      cx.fillStyle='rgba(99,102,241,0.15)';cx.fill();
      cx.strokeStyle=col;cx.lineWidth=2;cx.stroke();
    }

    cx.beginPath();cx.arc(p.x,p.y,r,0,Math.PI*2);
    cx.fillStyle=col+'22';cx.fill();
    cx.strokeStyle=col;cx.lineWidth=isSel?2.5:1.2;cx.stroke();

    // Status indicator dot
    const sc=COLORS[n.status]||'#64748b';
    cx.beginPath();cx.arc(p.x+r*0.7,p.y-r*0.7,3,0,Math.PI*2);
    cx.fillStyle=sc;cx.fill();

    if(showLabels){
      cx.fillStyle='#cbd5e1';cx.font='10px -apple-system,sans-serif';cx.textAlign='center';cx.textBaseline='top';
      const lb=n.label||n.id;
      cx.fillText(lb.length>22?lb.slice(0,20)+'…':lb,p.x,p.y+r+3);
      cx.font='8px monospace';cx.fillStyle=DOMAIN_COLORS[n.domain]||'#64748b';
      cx.fillText(n.domain,p.x,p.y+r+15);
    }
  });

  cx.restore();
}

function onClick(e){
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left-panX)/zoom;
  const my=(e.clientY-r.top-panY)/zoom;
  let clicked=null;
  nodes.forEach(n=>{
    const p=pos[n.id];if(!p)return;
    const rad=14+(n.evidence_for||0)*1.5;
    if((mx-p.x)**2+(my-p.y)**2<(rad+5)**2)clicked=n;
  });
  if(clicked){sel=clicked.id;showDetail(clicked.id)}
  else{sel=null;document.getElementById('detail').innerHTML='<div style="color:var(--t3);font-size:12px;padding:16px 0;text-align:center">Click a node to inspect</div>'}
  draw();
}

function showDetail(id){
  const d=details[id];if(!d)return;
  const ef=(d.evidence_for||[]).length;
  const ea=(d.evidence_against||[]).length;
  const vr=d.verification_results||{};
  const layers=vr.layers||{};

  let evHtml='';
  (d.evidence_for||[]).forEach(e=>{evHtml+=`<div class="ev support">▲ ${e.content} <span style="color:var(--t3)">(conf: ${(e.confidence*100).toFixed(0)}%)</span></div>`});
  (d.evidence_against||[]).forEach(e=>{evHtml+=`<div class="ev attack">▼ ${e.content} <span style="color:var(--t3)">[${e.severity}]</span></div>`});

  let redTeamHtml='';
  if(layers.red_team&&layers.red_team.attack_prompts){
    redTeamHtml='<h2 style="margin-top:12px">Red Team Attacks</h2>';
    (layers.red_team.strategies||[]).forEach(s=>{
      redTeamHtml+=`<div style="font-size:10px;color:var(--red);padding:2px 6px;background:rgba(239,68,68,.08);border-radius:3px;margin:3px 0">⚔ ${s}</div>`;
    });
  }

  document.getElementById('detail').innerHTML=`
    <div class="hdet">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="tl">${d.title||'(untitled)'}</div>
        <span class="badge b-${d.status}">${d.status}</span>
      </div>
      <div class="dm">◈ ${d.domain}</div>
      <div class="st">${d.statement}</div>
      <div class="vmeter">
        <div class="vl ${d.consensus_score>.7?'pass':'pend'}"><div class="lb">Consensus</div><div class="vv">${d.consensus_score>0?(d.consensus_score*100).toFixed(0)+'%':'—'}</div></div>
        <div class="vl ${d.formal_proof_status==='verified'?'pass':d.formal_proof_status==='failed'?'fail':'pend'}"><div class="lb">Formal</div><div class="vv">${d.formal_proof_status||'—'}</div></div>
        <div class="vl ${d.red_team_score>.7?'pass':d.red_team_score>0?'fail':'pend'}"><div class="lb">Red Team</div><div class="vv">${d.red_team_score>0?(d.red_team_score*100).toFixed(0)+'%':'—'}</div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;font-size:11px">
        <span style="color:var(--green)">▲ ${ef} supporting</span>
        <span style="color:var(--red)">▼ ${ea} attacking</span>
      </div>
      <div class="tags">${(d.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
    ${evHtml?`<div class="evlist">${evHtml}</div>`:''}
    ${redTeamHtml}
  `;
}

function renderPlugins(){
  const c=document.getElementById('plugins');
  c.innerHTML=Object.entries(plugins).map(([n,p])=>`
    <div class="pcard"><div class="nm">${n}</div><div class="hk">${p.hooks.join(', ')}</div></div>
  `).join('');
}

function renderStats(){
  document.getElementById('stats').textContent=`${nodes.length} hypotheses | ${edges.length} edges | ${Object.keys(plugins).length} universes`;
  const s=DATA.status;
  const byStatus=s.graph.by_status||{};
  document.getElementById('gstats').innerHTML=`
    <div>Total: <b>${s.graph.total}</b> hypotheses</div>
    <div>Edges: <b>${s.graph.edges}</b> connections</div>
    <div>Domains: ${(s.graph.domains||[]).join(', ')}</div>
    <div style="margin-top:6px">${Object.entries(byStatus).map(([k,v])=>`<span class="badge b-${k}" style="margin:1px">${k}: ${v}</span>`).join(' ')}</div>
    <div style="margin-top:6px">Verification log: ${s.verification_log} entries</div>
  `;
}

function renderVlog(){
  const c=document.getElementById('vlog');
  c.innerHTML=(DATA.verification_log||[]).slice(0,10).map(v=>`
    <div class="entry">${v.layer} → ${v.hypothesis_id?.slice(0,8)||'?'} [${v.status}]</div>
  `).join('');
}

function resetView(){panX=0;panY=0;zoom=1;draw()}
function toggleLabels(){showLabels=!showLabels;draw()}
function toggleEdges(){showEdges=!showEdges;draw()}
function highlightUnverified(){highlightMode=!highlightMode;draw()}
</script>
</body>
</html>
