[package]
name = "rhea-cc"
version = "0.1.0"
edition = "2021"
description = "Rhea Command Centre — native TUI binary"

[[bin]]
name = "rhea"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
