app = "rhea-tribunal"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "python3 src/tribunal_api.py"

[env]
  PORT = "8400"
  PYTHONUNBUFFERED = "1"

[[services]]
  internal_port = 8400
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
