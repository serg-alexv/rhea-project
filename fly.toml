app = "rhea-tribunal"
primary_region = "ams"

[build]
  dockerfile = "config/docker/Dockerfile.tribunal"

[env]
  PORT = "8400"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8400
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "rhea_data"
  destination = "/app/data"
